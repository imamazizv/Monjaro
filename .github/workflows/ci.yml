name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests against PostgreSQL
        run: mvn -B verify
      - name: Build runtime image
        run: docker build -t monjaro:ci .
